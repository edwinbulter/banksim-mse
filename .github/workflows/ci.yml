# Deployment pipeline (doc/werkwijze-mse.md, hoofdstuk 3; ADR 0002).
# Commit stage: snelle tests zonder cluster en de images, één keer gebouwd. Acceptance stage: precies die images
# installeren in een tijdelijk kind-cluster dat single-node nabootst, in dezelfde namespace banksim-mse, en daar
# de Playwright-acceptatietests draaien. De mutatietests (PIT) draaien parallel aan de acceptance stage (ADR 0032).
# Actions staan op commit-SHA vast.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Commit stage – backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: backend/mvnw -B -ntp -f backend/pom.xml verify

  mutatietests:
    # ADR 0018: PIT herhaalt de sabotage bij elke commit; faalt onder 95% per module. ADR 0032: de acceptance stage
    # wacht er niet op, maar een rode PIT-job maakt de pipeline wel rood. ADR 0048: per module een eigen job, die
    # tegelijk draaien; bank-api in twee delen (de profielen in backend/bank-api/pom.xml).
    name: Mutatietests (PIT) – ${{ matrix.deel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Elke job maakt zijn run af, zodat een rode module de uitkomst van de andere niet verbergt.
      fail-fast: false
      matrix:
        include:
          - deel: bank-api (transactie en rente)
            rapport: bank-api-transactie-rente
            modules: bank-api
            profiel: pit-transactie-rente
          - deel: bank-api (de rest)
            rapport: bank-api-rest
            modules: bank-api
            profiel: pit-rest
          - deel: bank-seed
            rapport: bank-seed
            modules: bank-seed
          - deel: bank-domain en bank-bff
            rapport: bank-domain-bff
            modules: bank-domain,bank-bff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # -am bouwt bank-domain mee, en PIT muteert die dan ook; dat kost alleen runnertijd (ADR 0048).
      - env:
          MODULES: ${{ matrix.modules }}
          PROFIEL: ${{ matrix.profiel }}
        run: backend/mvnw -B -ntp -f backend/pom.xml -pl "$MODULES" -am ${PROFIEL:+-P "$PROFIEL"} test-compile org.pitest:pitest-maven:mutationCoverage
      - name: PIT-rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pit-rapport-${{ matrix.rapport }}
          path: backend/*/target/pit-reports/
          if-no-files-found: ignore

  frontend:
    name: Commit stage – frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      # ADR 0034: de types van de frontend horen bij het contract; wie het contract wijzigt, genereert ze opnieuw.
      - run: npm --prefix api ci
      - run: npm --prefix api run types
      - run: git diff --exit-code -- frontend/src/app/api/bank-api.d.ts
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix e2e ci
      - run: npm --prefix e2e run typecheck
      - run: scripts/lagen-check.sh

  infrastructuur:
    name: Commit stage – infrastructuur
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - run: scripts/iac-check.sh

  images:
    name: Commit stage – images (één keer bouwen)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Images bouwen
        run: deploy/scripts/build-images.sh "${GITHUB_SHA::7}" --platform linux/amd64
      - name: Images bewaren voor de acceptance stage
        run: |
          tag="${GITHUB_SHA::7}"
          docker save -o images.tar "banksim-mse/bank-api:$tag" "banksim-mse/bank-bff:$tag" \
            "banksim-mse/bank-seed:$tag" "banksim-mse/bank-web:$tag"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: images.tar
          retention-days: 3

  acceptance:
    name: Acceptance stage – acceptatietests (kind, namespace banksim-mse)
    # ADR 0049: niet op backend (mvnw verify); die is later klaar dan de images en blijft verplicht voor de pipeline.
    needs: [frontend, infrastructuur, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONTEXT: kind-banksim-mse-ci
      # De shell-driver (bank-seed) gebruikt deze context; zonder valt hij terug op kind-single-node.
      BANKSIM_CONTEXT: kind-banksim-mse-ci
      # ADR 0054: otel-lgtm alleen in de job die de telemetrie test.
      BANKSIM_OBSERVABILITY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: ./.github/actions/kind-banksim-mse
      - name: Playwright-browsers uit de cache
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # De browsers horen bij de Playwright-versie, en die staat in de lockfile.
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Systeempakketten van Playwright, de map
        id: apt
        # ADR 0056: apt bewaart de pakketten in een map van de runner, zodat de cache ze kan terugzetten en bewaren.
        # ImageVersion hoort in de sleutel: een nieuw runner-image kan andere versies van de pakketten nodig hebben.
        run: |
          mkdir -p "$HOME/apt-archief/partial"
          echo "Dir::Cache::Archives \"$HOME/apt-archief\";" | sudo tee /etc/apt/apt.conf.d/90-apt-archief
          echo "runner=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Systeempakketten van Playwright uit de cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archief/*.deb
          key: apt-chromium-firefox-webkit-${{ steps.apt.outputs.runner }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Playwright-browsers
        timeout-minutes: 15
        env:
          UIT_CACHE: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          npm --prefix e2e ci
          # Uit de cache: alleen de systeempakketten; anders ook de browsers downloaden.
          if [ "$UIT_CACHE" = "true" ]; then
            npm --prefix e2e exec -- playwright install-deps chromium firefox webkit
          else
            npm --prefix e2e run install-browsers
          fi
      - name: Systeempakketten van Playwright in de cache
        # Direct na install-deps, niet aan het eind van de job: dan vult ook een job die later faalt de cache.
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archief/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Acceptatietests
        run: npm --prefix e2e test
      - name: Clusterstatus bij falen
        if: failure()
        run: |
          kubectl -n banksim-mse get pods -o wide || true
          kubectl -n banksim-mse get events --sort-by=.lastTimestamp || true
          kubectl -n banksim-mse logs -l app.kubernetes.io/part-of=banksim-mse --all-containers --tail=100 --prefix || true
      - name: Playwright-rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-rapport
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
      # ADR 0053: de workflow Allure-rapport voegt de resultaten van de vier jobs samen.
      - name: Allure-resultaten
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-resultaten-acceptatie
          path: e2e/allure-results/
          if-no-files-found: ignore

  installatie:
    # Een eigen runner en cluster, parallel aan de acceptatietests: de installatiescenario's installeren en
    # verwijderen zelf (doc/werkwijze-mse.md, 9.2). Verdeeld over drie jobs, elk met een eigen runner en cluster
    # (ADR 0047): installatie.spec.ts apart, de rest in twee shards (ADR 0052). observability.spec.ts in een eigen job,
    # de enige met otel-lgtm (ADR 0054).
    name: Acceptance stage – installatiescenario's ${{ matrix.deel }} (kind, namespace banksim-mse)
    # ADR 0049: niet op backend, net als de acceptatietests.
    needs: [frontend, infrastructuur, images]
    runs-on: ubuntu-24.04
    strategy:
      # Elke job maakt zijn run af, zodat een fout in de ene job de uitkomst van de andere niet verbergt.
      fail-fast: false
      matrix:
        deel: [installatie, overig-1, overig-2, telemetrie]
    timeout-minutes: 30
    env:
      CONTEXT: kind-banksim-mse-ci
      # De shell-driver (bank-seed, installatiescenario's) gebruikt deze context; zonder valt hij terug op kind-single-node.
      BANKSIM_CONTEXT: kind-banksim-mse-ci
      # ADR 0054: otel-lgtm alleen in de job die de telemetrie test.
      BANKSIM_OBSERVABILITY: ${{ matrix.deel == 'telemetrie' && 'true' || 'false' }}
      # ADR 0055: de verkeersklanten voor k6, ook alleen in die job.
      BANKSIM_VERKEER: ${{ matrix.deel == 'telemetrie' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: ./.github/actions/kind-banksim-mse
      - name: Playwright-browsers uit de cache
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Een eigen sleutel: deze cache heeft alleen chromium, die van de acceptatietests alle drie.
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Systeempakketten van Playwright, de map
        id: apt
        # ADR 0056: apt bewaart de pakketten in een map van de runner, zodat de cache ze kan terugzetten en bewaren.
        # ImageVersion hoort in de sleutel: een nieuw runner-image kan andere versies van de pakketten nodig hebben.
        run: |
          mkdir -p "$HOME/apt-archief/partial"
          echo "Dir::Cache::Archives \"$HOME/apt-archief\";" | sudo tee /etc/apt/apt.conf.d/90-apt-archief
          echo "runner=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Systeempakketten van Playwright uit de cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archief/*.deb
          key: apt-chromium-${{ steps.apt.outputs.runner }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Playwright met chromium
        # Alleen chromium: het upgradescenario logt na de upgrade in via de browser.
        timeout-minutes: 15
        env:
          UIT_CACHE: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          npm --prefix e2e ci
          if [ "$UIT_CACHE" = "true" ]; then
            npm --prefix e2e exec -- playwright install-deps chromium
          else
            npm --prefix e2e exec -- playwright install --with-deps chromium
          fi
      - name: Systeempakketten van Playwright in de cache
        # Direct na install-deps, niet aan het eind van de job: dan vult ook een job die later faalt de cache.
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archief/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Nep-origineel in namespace banksim
        # Zodat "Het origineel blijft onaangeroerd" ook hier iets controleert (doc/werkwijze-mse.md, 9.2).
        # Het bank-web-image staat al op de node; er komt geen nieuw image bij.
        run: |
          kubectl create namespace banksim
          kubectl -n banksim create deployment origineel --image="banksim-mse/bank-web:${GITHUB_SHA::7}" --port=8080
          kubectl -n banksim create service clusterip origineel --tcp=80:8080
          kubectl -n banksim create ingress origineel --class=nginx --rule='bank.localtest.me/*=origineel:80,tls'
          kubectl -n banksim rollout status deployment/origineel --timeout=120s
      - name: Installatiescenario's (ook @destructief)
        env:
          BANKSIM_DESTRUCTIEF: '1'
          PLAYWRIGHT_HTML_REPORT: playwright-report-infra
          DEEL: ${{ matrix.deel }}
        # ADR 0052: de serial-groep van installatie.spec.ts in een eigen job; Playwright verdeelt op aantal, en zette die
        # groep anders in de shard waar zijn eerste scenario viel. Een nieuw bestand komt vanzelf in overig.
        # ADR 0054, 0055: observability.spec.ts en verkeer.spec.ts in de job telemetrie, met otel-lgtm en de
        # verkeersklanten; de scenario's daar tegelijk, want ze installeren niets zelf.
        run: |
          if [ "$DEEL" = installatie ]; then
            selectie=(specs/infra/installatie.spec.ts)
          elif [ "$DEEL" = telemetrie ]; then
            selectie=(specs/infra/observability.spec.ts specs/infra/verkeer.spec.ts)
            export BANKSIM_INFRA_WORKERS=3
          else
            selectie=(--grep-invert 'installatie\.spec\.ts|observability\.spec\.ts|verkeer\.spec\.ts' --shard="${DEEL#overig-}/2")
          fi
          BANKSIM_CONTEXT="$CONTEXT" BANKSIM_IMAGE_TAG="${GITHUB_SHA::7}" npm --prefix e2e run test:infra -- "${selectie[@]}"
      - name: Clusterstatus bij falen
        if: failure()
        run: |
          kubectl -n banksim-mse get pods -o wide || true
          kubectl -n banksim-mse get events --sort-by=.lastTimestamp || true
          kubectl -n banksim-mse logs -l app.kubernetes.io/part-of=banksim-mse --all-containers --tail=100 --prefix || true
      - name: Playwright-rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-rapport-infra-${{ matrix.deel }}
          path: |
            e2e/playwright-report-infra/
            e2e/test-results/
          if-no-files-found: ignore
      # ADR 0053: de workflow Allure-rapport voegt de resultaten van de vier jobs samen.
      - name: Allure-resultaten
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-resultaten-infra-${{ matrix.deel }}
          path: e2e/allure-results/
          if-no-files-found: ignore
