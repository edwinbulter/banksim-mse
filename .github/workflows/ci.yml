# Deployment pipeline (doc/werkwijze-mse.md, hoofdstuk 3; ADR 0002).
# Commit stage: snelle tests zonder cluster en de images, één keer gebouwd. Acceptance stage: precies die images
# installeren in een tijdelijk kind-cluster dat single-node nabootst, in dezelfde namespace banksim-mse, en daar
# de Playwright-acceptatietests draaien.
# Actions staan op commit-SHA vast.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Commit stage – backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: backend/mvnw -B -ntp -f backend/pom.xml verify

  mutatietests:
    # ADR 0018: PIT herhaalt de sabotage bij elke commit; faalt onder 95% per module.
    name: Commit stage – mutatietests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: backend/mvnw -B -ntp -f backend/pom.xml test-compile org.pitest:pitest-maven:mutationCoverage
      - name: PIT-rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pit-rapport
          path: backend/*/target/pit-reports/
          if-no-files-found: ignore

  frontend:
    name: Commit stage – frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix e2e ci
      - run: npm --prefix e2e run typecheck

  infrastructuur:
    name: Commit stage – infrastructuur
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - run: scripts/iac-check.sh

  images:
    name: Commit stage – images (één keer bouwen)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Images bouwen
        run: deploy/scripts/build-images.sh "${GITHUB_SHA::7}" --platform linux/amd64
      - name: Images bewaren voor de acceptance stage
        run: |
          tag="${GITHUB_SHA::7}"
          docker save -o images.tar "banksim-mse/bank-api:$tag" "banksim-mse/bank-bff:$tag" \
            "banksim-mse/bank-seed:$tag" "banksim-mse/bank-web:$tag"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: images.tar
          retention-days: 3

  acceptance:
    name: Acceptance stage – acceptatietests (kind, namespace banksim-mse)
    needs: [backend, mutatietests, frontend, infrastructuur, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONTEXT: kind-banksim-mse-ci
      # De shell-driver (bank-seed) gebruikt deze context; zonder valt hij terug op kind-single-node.
      BANKSIM_CONTEXT: kind-banksim-mse-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: ./.github/actions/kind-banksim-mse
      - name: Playwright-browsers uit de cache
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # De browsers horen bij de Playwright-versie, en die staat in de lockfile.
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Playwright-browsers
        timeout-minutes: 15
        env:
          UIT_CACHE: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          npm --prefix e2e ci
          # Uit de cache: alleen de systeempakketten; anders ook de browsers downloaden.
          if [ "$UIT_CACHE" = "true" ]; then
            npm --prefix e2e exec -- playwright install-deps chromium firefox webkit
          else
            npm --prefix e2e run install-browsers
          fi
      - name: Acceptatietests
        run: npm --prefix e2e test
      - name: Clusterstatus bij falen
        if: failure()
        run: |
          kubectl -n banksim-mse get pods,events --sort-by=.lastTimestamp || true
          kubectl -n banksim-mse logs -l app.kubernetes.io/part-of=banksim-mse --all-containers --tail=100 --prefix || true
      - name: Playwright-rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-rapport
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  installatie:
    # Een eigen runner en cluster, parallel aan de acceptatietests: de installatiescenario's installeren en
    # verwijderen zelf, en hebben de browsers niet nodig (doc/werkwijze-mse.md, 9.2).
    name: Acceptance stage – installatiescenario's (kind, namespace banksim-mse)
    needs: [backend, mutatietests, frontend, infrastructuur, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONTEXT: kind-banksim-mse-ci
      # De shell-driver (bank-seed, installatiescenario's) gebruikt deze context; zonder valt hij terug op kind-single-node.
      BANKSIM_CONTEXT: kind-banksim-mse-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: ./.github/actions/kind-banksim-mse
      - name: Playwright zonder browsers
        run: npm --prefix e2e ci
      - name: Nep-origineel in namespace banksim
        # Zodat "Het origineel blijft onaangeroerd" ook hier iets controleert (doc/werkwijze-mse.md, 9.2).
        # Het bank-web-image staat al op de node; er komt geen nieuw image bij.
        run: |
          kubectl create namespace banksim
          kubectl -n banksim create deployment origineel --image="banksim-mse/bank-web:${GITHUB_SHA::7}" --port=8080
          kubectl -n banksim create service clusterip origineel --tcp=80:8080
          kubectl -n banksim create ingress origineel --class=nginx --rule='bank.localtest.me/*=origineel:80,tls'
          kubectl -n banksim rollout status deployment/origineel --timeout=120s
      - name: Installatiescenario's (ook @destructief)
        env:
          BANKSIM_DESTRUCTIEF: '1'
          PLAYWRIGHT_HTML_REPORT: playwright-report-infra
        run: BANKSIM_CONTEXT="$CONTEXT" BANKSIM_IMAGE_TAG="${GITHUB_SHA::7}" npm --prefix e2e run test:infra
      - name: Clusterstatus bij falen
        if: failure()
        run: |
          kubectl -n banksim-mse get pods,events --sort-by=.lastTimestamp || true
          kubectl -n banksim-mse logs -l app.kubernetes.io/part-of=banksim-mse --all-containers --tail=100 --prefix || true
      - name: Playwright-rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-rapport-infra
          path: |
            e2e/playwright-report-infra/
            e2e/test-results/
          if-no-files-found: ignore
