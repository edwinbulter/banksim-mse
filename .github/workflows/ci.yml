# Deployment pipeline (doc/werkwijze-mse.md, hoofdstuk 3; ADR 0002).
# Commit stage: snelle tests zonder cluster en de images, één keer gebouwd. Acceptance stage: precies die images
# installeren in een tijdelijk kind-cluster dat single-node nabootst, in dezelfde namespace banksim-mse, en daar
# de Playwright-acceptatietests draaien.
# Actions staan op commit-SHA vast.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Commit stage – backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: backend/mvnw -B -ntp -f backend/pom.xml verify

  frontend:
    name: Commit stage – frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix e2e ci
      - run: npm --prefix e2e run typecheck

  infrastructuur:
    name: Commit stage – infrastructuur
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - run: scripts/iac-check.sh

  images:
    name: Commit stage – images (één keer bouwen)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Images bouwen
        run: deploy/scripts/build-images.sh "${GITHUB_SHA::7}" --platform linux/amd64
      - name: Images bewaren voor de acceptance stage
        run: docker save -o images.tar "banksim-mse/bank-api:${GITHUB_SHA::7}" "banksim-mse/bank-web:${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: images.tar
          retention-days: 3

  acceptance:
    name: Acceptance stage (kind, namespace banksim-mse)
    needs: [backend, frontend, infrastructuur, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONTEXT: kind-banksim-mse-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - name: Images uit de commit stage laden
        run: docker load -i images.tar
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - name: kind-cluster banksim-mse-ci
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.31.0
          cluster_name: banksim-mse-ci
          config: .github/kind-ci.yaml
      - name: ingress-nginx (dezelfde versie als in single-node)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=available deployment/ingress-nginx-controller --timeout=180s
          kubectl -n ingress-nginx wait --for=condition=complete job --all --timeout=180s
      - name: ingress-nginx admission-webhook bereikbaar
        # "available" is niet genoeg: de webhook weigert daarna nog even verbindingen ("connection refused").
        run: |
          for _ in $(seq 30); do
            if kubectl create ingress webhook-probe -n default --class=nginx --rule='probe.local/=probe:80' \
                 --dry-run=server -o name >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "De admission-webhook van ingress-nginx reageert niet" >&2
          exit 1
      - name: BankSim-MSE installeren met de images uit de commit stage (met rooktests)
        run: deploy/scripts/install.sh --context "$CONTEXT" --image-tag "${GITHUB_SHA::7}"
      - name: Playwright-browsers
        timeout-minutes: 15
        run: |
          npm --prefix e2e ci
          npm --prefix e2e run install-browsers
      - name: Acceptatietests
        run: npm --prefix e2e test
      - name: Clusterstatus bij falen
        if: failure()
        run: |
          kubectl -n banksim-mse get pods,events --sort-by=.lastTimestamp || true
          kubectl -n banksim-mse logs -l app.kubernetes.io/part-of=banksim-mse --all-containers --tail=100 --prefix || true
      - name: Playwright-rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-rapport
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
