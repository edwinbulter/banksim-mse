# Image-tag van alle eigen images (git-commit); install.sh zet hem.
imageTag: dev

images:
  api: banksim-mse/bank-api
  bff: banksim-mse/bank-bff
  web: banksim-mse/bank-web
  # Externe images op digest, dezelfde versies als het origineel (ADR 0007, 0009).
  keycloak: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
  postgres: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  # ADR 0017: nog geen build voor Keycloak 26.8; 26.5.5 is getest tegen 26.8.0.
  keycloakConfigCli: adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274

hosts:
  bank: bank-mse.localtest.me
  auth: auth-mse.localtest.me

ingress:
  className: nginx

postgres:
  storageClass: standard
  storage: 1Gi

revisionHistoryLimit: 3

# Wachtwoorden en client secrets staan niet hier, maar in Secrets die install.sh aanmaakt (ADR 0009).
resources:
  api:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 512Mi }
  bff:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 512Mi }
  web:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 32Mi }
  keycloak:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 1Gi }
  keycloakConfig:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  postgres:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
