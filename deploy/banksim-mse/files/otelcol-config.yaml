# De configuratie van de Collector uit grafana/otel-lgtm 0.41.0, met daarbij Keycloak (ADR 0054).
# Zet de chart een nieuwe versie van otel-lgtm vast, vergelijk dit bestand dan met /otel-lgtm/otelcol-config.yaml in dat image.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]
        # ADR 0054: de eigen metrics van Keycloak (KC_METRICS_ENABLED), op zijn management-poort.
        - job_name: "keycloak"
          scrape_interval: 10s
          metrics_path: /metrics
          static_configs:
            - targets: ["keycloak:9000"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces]
      #exporters: [otlp_http/traces,debug/traces]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [batch]
      exporters: [otlp_http/metrics]
      #exporters: [otlp_http/metrics,debug/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
      #exporters: [otlp_http/logs,debug/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
