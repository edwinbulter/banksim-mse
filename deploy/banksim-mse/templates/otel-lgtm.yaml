{{- /* ADR 0054: Collector, Prometheus, Tempo, Loki en Grafana in één container; Grafana via make grafana (port-forward). */}}
{{- if .Values.observability.enabled }}
{{- $ctx := dict "root" . "name" "otel-lgtm" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-lgtm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "banksim-mse.labels" $ctx | nindent 4 }}
data:
  otelcol-config.yaml: |
    {{- .Files.Get "files/otelcol-config.yaml" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "banksim-mse.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "banksim-mse.selector" $ctx | nindent 4 }}
  ports:
    - { name: grafana, port: 3000, targetPort: 3000 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    # Tempo en Loki: de acceptatietests zoeken erin via de service-proxy van de API-server (e2e/drivers/telemetrie).
    - { name: tempo, port: 3200, targetPort: 3200 }
    - { name: loki, port: 3100, targetPort: 3100 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "banksim-mse.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "banksim-mse.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "banksim-mse.labels" $ctx | nindent 8 }}
      annotations:
        # Een andere Collector-configuratie start de pod opnieuw.
        checksum/config: {{ .Files.Get "files/otelcol-config.yaml" | sha256sum }}
    spec:
      containers:
        - name: otel-lgtm
          image: {{ .Values.images.otelLgtm }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: tempo, containerPort: 3200 }
            - { name: loki, containerPort: 3100 }
          readinessProbe:
            httpGet: { path: /ready, port: 13133 }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /otel-lgtm/otelcol-config.yaml, subPath: otelcol-config.yaml }
            - { name: data, mountPath: /data }
          resources:
            {{- toYaml .Values.resources.otelLgtm | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: otel-lgtm }
        # De telemetrie overleeft een herstart niet; verwijderen laat niets achter.
        - name: data
          emptyDir: {}
{{- end }}
