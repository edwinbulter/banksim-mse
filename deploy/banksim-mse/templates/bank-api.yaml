{{- $ctx := dict "root" . "name" "bank-api" }}
apiVersion: v1
kind: Service
metadata:
  name: bank-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "banksim-mse.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "banksim-mse.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "banksim-mse.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "banksim-mse.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "banksim-mse.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: bank-api
          image: {{ include "banksim-mse.image" (dict "root" . "key" "api") }}
          imagePullPolicy: IfNotPresent
          env:
            - name: BANKSIM_VERSIE
              value: {{ .Values.imageTag | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
