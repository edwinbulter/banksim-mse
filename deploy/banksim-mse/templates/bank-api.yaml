{{- $ctx := dict "root" . "name" "bank-api" }}
apiVersion: v1
kind: Service
metadata:
  name: bank-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "banksim-mse.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "banksim-mse.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "banksim-mse.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "banksim-mse.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "banksim-mse.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: bank-api
          image: {{ include "banksim-mse.image" (dict "root" . "key" "api") }}
          imagePullPolicy: IfNotPresent
          env:
            - name: BANKSIM_VERSIE
              value: {{ .Values.imageTag | quote }}
            # ADR 0009; Flyway migreert bij het starten.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/bank
            - name: SPRING_DATASOURCE_USERNAME
              value: bank
            # ADR 0008: tokens van de realm; de sleutels intern ophalen, de issuer is de publieke URL.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: https://{{ .Values.hosts.auth }}/realms/banksim-mse
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak:8080/realms/banksim-mse/protocol/openid-connect/certs
          envFrom:
            - secretRef: { name: bank-api }
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
